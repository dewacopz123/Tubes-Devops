# =========================================================================
# SonarQube / SonarCloud Configuration for eLabora (Monorepo)
# =========================================================================

# Identitas Project
sonar.projectKey=elabora-devops
sonar.projectName=eLabora-devops
sonar.organization=ilhamridzuan
sonar.projectVersion=1.0.0

# Encoding
sonar.sourceEncoding=UTF-8

# Direktori Source Code yang dianalisis
sonar.sources=backend/src,frontend/app,frontend/resources/views

# Direktori Test Cases
sonar.tests=backend/tests,frontend/tests

# File / Direktori yang dikecualikan dari analisis kualitas kode
sonar.exclusions=**/node_modules/**,**/vendor/**,**/storage/**,**/public/**,**/bootstrap/cache/**,**/database/**,**/*.min.js,**/*.min.css,**/*.config.js

# Laporan Pengujian dan Code Coverage
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.php.coverage.reportPaths=frontend/coverage/cobertura.xml
