name: eLabora CI/CD & DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Pastikan secrets dan permission pipeline diatur dengan prinsip least privilege
permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # STAGE 1: DEVSECOPS - DEPENDENCY SECURITY AUDIT
  # =========================================================================
  security-audit:
    name: "DevSecOps: Dependency Vulnerability Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js for Backend Audit
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Run Backend npm audit (Node.js)
        working-directory: ./backend
        run: |
          echo "========================================================"
          echo "Menjalankan npm audit untuk dependensi Backend (Node.js)"
          echo "========================================================"
          # Menjalankan audit dan mencatat laporan kerentanan (DevSecOps)
          npm audit --audit-level=high || true

      - name: Setup PHP for Frontend Audit
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Run Frontend composer audit (PHP/Laravel)
        working-directory: ./frontend
        run: |
          echo "========================================================"
          echo "Menjalankan composer audit untuk dependensi Frontend (PHP)"
          echo "========================================================"
          composer audit || true

  # =========================================================================
  # STAGE 2: BACKEND CI - BUILD, TEST & COVERAGE
  # =========================================================================
  backend-ci:
    name: "Backend CI: Build & Automated Tests"
    runs-on: ubuntu-latest
    needs: security-audit

    # Database service container untuk kebutuhan testing integrasi
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: elabora_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Setup Test Environment Database
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: elabora_db
          DB_SSL: false
        run: |
          echo "Importing database schema into test container..."
          mysql -h 127.0.0.1 -P 3306 -u root -proot elabora_db < ../database/database-elabora.sql

      - name: Run Backend Automated Tests with Coverage
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: elabora_db
          DB_SSL: false
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'devops-secret-key-test-environment-12345' }}
        run: |
          npm run test:coverage || npm test

      - name: Upload Backend Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================================
  # STAGE 3: FRONTEND CI - BUILD & TESTING (LARAVEL & VITE)
  # =========================================================================
  frontend-ci:
    name: "Frontend CI: Laravel Build & PHPUnit Tests"
    runs-on: ubuntu-latest
    needs: security-audit

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3, curl, zip
          coverage: xdebug
          tools: composer:v2

      - name: Setup Node.js for Vite Assets
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('frontend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Frontend Composer Dependencies
        working-directory: ./frontend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Frontend NPM Dependencies & Build Assets
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Configure Frontend Environment
        working-directory: ./frontend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Frontend Automated Tests (PHPUnit)
        working-directory: ./frontend
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          php artisan test

      - name: Upload Frontend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/storage/logs/
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================================
  # STAGE 4: CODE QUALITY ANALYSIS - SONARQUBE / SONARCLOUD
  # =========================================================================
  sonarqube-analysis:
    name: "Code Quality: SonarQube / SonarCloud Scan"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always() && (needs.backend-ci.result == 'success' || needs.backend-ci.result == 'skipped')
    steps:
      - name: Checkout Source Code (Full History for Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Backend Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage/
        continue-on-error: true

      - name: Execute SonarQube / SonarCloud Scanner
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY || 'elabora-monorepo' }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION || 'dewacopz123' }}
            -Dsonar.sources=backend/src,frontend/app
            -Dsonar.tests=backend/tests,frontend/tests
            -Dsonar.exclusions=**/node_modules/**,**/vendor/**,**/storage/**,**/public/**,**/bootstrap/cache/**,**/database/**
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
        continue-on-error: true
